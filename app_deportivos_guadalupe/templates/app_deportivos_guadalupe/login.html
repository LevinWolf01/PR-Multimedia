{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deportivos Guadalupe - Iniciar Sesión</title>
    <!-- Favicon del Concesionario -->
    <link rel="shortcut icon" href="{% static 'source/imagenes/sistemas/favicon.ico' %}" type="image/x-icon">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(230, 57, 70, 0.15);
            text-align: center;
        }

        .logo-container img {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
        }

        .login-card h2 {
            font-size: 24px;
            color: #e63946;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .login-card p {
            color: #888888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: #aaaaaa;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333333;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            border-color: #e63946;
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: #e63946;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background: #d62828;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo o Icono -->
        <div class="logo-container">
            <img src="{% static 'recursos/imagenes/iconos/volante.svg' %}" alt="Logo Guadalupe" onerror="this.src='{% static 'recursos/imagenes/sistemas/favicon.ico' %}'">
        </div>

        <h2>Deportivos Guadalupe</h2>
        <p>Acceso al Panel de Control VIP</p>

        <!-- Formulario -->
        <form method="POST">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="username">Usuario Admin</label>
                <!-- Valor prefijado -->
                <input type="text" id="username" name="username" value="admin_guadalupe" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <!-- Valor prefijado -->
                <input type="password" id="password" name="password" value="v8biturbo2026" required>
            </div>

            <button type="submit" class="btn-login">Ingresar al Garaje</button>
        </form>
    </div>

</body>
</html>
